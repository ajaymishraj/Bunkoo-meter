<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <meta
      name="description"
      content="Smart attendance tracking and management tool for students. Track your attendance, simulate scenarios, and stay above your target percentage."
    />
    <meta
      name="google-site-verification"
      content="hQVJ7mOa7zxgFxrZ0AZW48F755rSomwP8smV1NHbOT0"
    />
    <meta
      name="keywords"
      content="attendance tracker, bunkoo meter, class attendance, student attendance, attendance calculator"
    />
    <title>Bunkoo Meter</title>
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="./logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="./logopic.png?v=5" />
    <link rel="manifest" href="./manifest.json?v=5" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (Required for styling) -->
    <link rel="stylesheet" href="./tailwind.css?v=2.6" />

    <link rel="stylesheet" href="./styles.css?v=1.4" />

    <!-- Firebase SDK -->
    <script src="./firebase.config.js?v=1.3"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
      import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        updateDoc,
        deleteDoc,
        onSnapshot,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
      import {
        getAuth,
        signInAnonymously,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import {
        initializeAppCheck,
        ReCaptchaV3Provider,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const authReady = Promise.resolve(null); // No auth required, just return null immediately
      window.__fb = {
        app,
        auth,
        authReady,
        db: getFirestore(app),
        doc,
        setDoc,
        getDoc,
        updateDoc,
        deleteDoc,
        onSnapshot,
        serverTimestamp,
      };

      if (firebaseConfig.measurementId) {
        getAnalytics(app);
      }

      // App Check disabled for now to allow unauthenticated access
      // initializeAppCheck(app, {
      //   provider: new ReCaptchaV3Provider(
      //     "6LdH1R4tAAAAAHpi3god3uu4EcQvDg0ESBC3XpsN",
      //   ),
      //   isTokenAutoRefreshEnabled: true,
      // });
    </script>

    <!-- idb for IndexedDB -->
    <script src="https://cdn.jsdelivr.net/npm/idb@7/build/umd.js"></script>

    <script src="./config.js"></script>

    <!-- Register Service Worker for PWA -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>

    <!-- React Dependencies -->
    <script
      src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"
      crossorigin
    ></script>
  </head>
  <body>
    <div
      id="offline-banner"
      style="
        display: none;
        width: 100%;
        background: #f59e0b;
        color: #fff;
        text-align: center;
        padding: 4px;
        font-size: 12px;
        font-weight: bold;
        position: fixed;
        top: 0;
        z-index: 9999;
      "
    >
      You're offline — AI features paused 📡
    </div>
    <div id="root"></div>
    <div class="watermark">Designed by Ajay Mishra</div>
    <script src="./app.js?v=4.4"></script>
  </body>
</html>
